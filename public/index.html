<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam System</title>
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#0f1c33;--muted:#5d6b82;--line:#dde3ec;--acc:#14795e;--onacc:#fff;--navy:#0e2240;--gold:#c8952a;--bad:#c43d34;--warn:#b4650a;--sh:0 1px 2px rgba(14,34,64,.06),0 6px 20px rgba(14,34,64,.05)}
:root[data-theme=dark]{--bg:#0b1322;--card:#142033;--ink:#e8edf6;--muted:#9aa8bf;--line:#26354b;--acc:#3fc3a2;--onacc:#06201b;--navy:#08111f;--gold:#e0b04e;--bad:#ef7b7b;--warn:#f0a35a;--sh:none}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,"Segoe UI","Noto Sans Ethiopic",Roboto,sans-serif}
h1,h2,h3,h4,.big{font-family:Georgia,"Noto Serif Ethiopic",serif;margin:0 0 10px;letter-spacing:-.01em}
h1{font-size:1.6rem}h3{font-size:1.1rem}.big{font-size:3rem}
button{font:inherit;font-weight:600;padding:8px 16px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:var(--onacc);cursor:pointer;transition:filter .15s}
button:hover{filter:brightness(1.08)}button.g{background:transparent;color:var(--acc)}button.g:hover{background:color-mix(in srgb,var(--acc) 12%,transparent)}button:disabled{opacity:.4;cursor:default}
input,textarea,select{width:100%;padding:9px 11px;margin:4px 0 12px;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px}
input:focus,textarea:focus,select:focus{border-color:var(--acc);outline:0}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.search{max-width:340px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:.8rem;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.err{color:var(--bad);min-height:1.4em;margin:0 0 8px}.muted{color:var(--muted)}.pass{color:var(--acc)}.fail{color:var(--bad)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.pill{padding:2px 10px;border:1px solid var(--line);border-radius:99px;font-size:.82rem;white-space:nowrap}
.rv{padding:10px 0;border-bottom:1px solid var(--line)}.mask{-webkit-text-security:disc;text-security:disc}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--muted);font-size:.85rem;box-shadow:var(--sh)}
.stats b{display:block;font:700 1.9rem Georgia,serif;color:var(--ink)}
.bar{display:grid;grid-template-columns:70px 1fr 30px;gap:10px;align-items:center;margin:8px 0;font-size:.85rem}
.bar i{height:10px;border-radius:6px;background:linear-gradient(var(--acc),var(--acc)) 0 0/var(--w) 100% no-repeat,var(--line)}.bar b{text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chips .g.on{background:var(--acc);color:var(--onacc)}
label.o{display:block;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}label.o:hover{border-color:var(--muted)}
label.o:has(input:checked){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
label.o input,label.chk input{width:auto;margin:0 8px 0 0}label.chk{display:inline-block;margin-right:16px}
#nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}#nav button{width:36px;height:36px;padding:0;background:none;color:var(--ink);border-color:var(--line)}
#nav button.ans{background:var(--line)}#nav button.cur{border:2px solid var(--acc)}#nav button.flag{border:2px dashed var(--warn)}
#tm{font:700 1.3rem Georgia,serif;font-variant-numeric:tabular-nums}#tm.low{color:var(--bad)}#warn{color:var(--warn);min-height:1.4em}
.pbar{height:6px;background:var(--line);border-radius:6px;margin:10px 0;overflow:hidden}.pbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--navy);color:#dbe5f5;padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;border-top:4px solid var(--gold)}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;font-family:Georgia,serif}
.mono{background:var(--gold);color:#241a00;font:700 .8rem Georgia,serif;padding:6px 7px;border-radius:6px}
.side .nv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 10px;font-weight:500}
.side .nv:hover{background:rgba(255,255,255,.08);filter:none}.side .nv.on{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 3px 0 var(--gold)}
.side .nv i{font-style:normal;width:1.2em;text-align:center}.grow{flex:1}
.main{padding:26px 30px 40px;max-width:1080px;width:100%}.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:18px}.hd p{margin:0}
.pane{display:none}.pane.on{display:block}.focus{max-width:820px;margin:0 auto;padding:20px 16px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;z-index:120;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
body.auth{--bg:#f2f4f8;--ink:#0f1c33;--line:#dde3ec;--muted:#5d6b82;--card:#fff;background:url('/bg.jpg') center/cover fixed no-repeat,#0e2240}
body.auth #app{min-height:100vh;display:grid;place-items:center;padding:16px}body.auth .card{width:100%;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.logo-img{width:96px;height:96px;object-fit:contain;display:block;margin:0 auto 12px}
.auth .card input,.auth .card label{max-width:260px;margin-left:auto;margin-right:auto;display:block;font-size:.88rem}.auth .card label{font-weight:600;font-size:.8rem;margin-bottom:4px}
.auth .card input{margin-bottom:12px}.auth .card button.btn-primary{max-width:260px;width:100%;margin:10px auto 0;display:block}
.pw-container{position:relative;max-width:260px;margin:0 auto 12px}.pw-container input{padding-right:58px;margin:0!important}
.pw-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:#e2e8f0;border:0;padding:4px 7px;font-size:.7rem;border-radius:4px;color:#0f2b48}
@media(max-width:780px){.shell{display:block}.side{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;overflow-x:auto;padding:6px;border-top:0;z-index:20;gap:2px}
.side .brand,.grow{display:none}.side .nv{flex-direction:column;gap:2px;font-size:.72rem;padding:6px 10px;width:auto;white-space:nowrap}.side .nv.on{box-shadow:inset 0 3px var(--gold)}.main{padding:16px 14px 96px}}
@media print{.side,button,.search,.toast{display:none!important}.shell{display:block}.pane{display:block!important}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
document.documentElement.dataset.theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
const $ = id => document.getElementById(id), app = $("app");
let me = JSON.parse(localStorage.getItem("me") || "null"), timer, cur = null, lastRs = [], saveT;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pc = r => r.percent ?? Math.round(r.score / r.total * 100);
const filled = a => a !== null && a !== undefined && a !== "" && !(Array.isArray(a) && !a.length);

async function api(path, method = "GET", body) {
  let r, d;
  try { r = await fetch("/api/" + path, { method, headers: { "Content-Type": "application/json", "x-token": me?.token || "" }, body: body ? JSON.stringify(body) : undefined }); d = await r.json(); }
  catch { throw new Error("Cannot reach the server. Run npm start and open http://localhost:3000"); }
  if (r.status === 403 && path !== "login") { logout(); throw new Error("Please log in again"); }
  if (!r.ok) throw new Error(d.error || "Error");
  return d;
}
function logout() { clearInterval(timer); stopCam(); $("cam")?.remove(); cur = null; localStorage.removeItem("me"); me = null; home(); }
// ---- In-page dialogs (browsers like VS Code Simple Browser block prompt/confirm) ----
function dialog({ title = "", text = "", inputs = [], cancel = true }) {
  return new Promise(res => {
    const d = document.createElement("div");
    d.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:99";
    d.innerHTML = `<div class="card" style="max-width:420px;width:100%;margin:0"><h3 style="margin-top:0">${esc(title)}</h3><p style="white-space:pre-line">${esc(text)}</p>${inputs.map(l => `<label>${esc(l)}<input type="text" class="mask" autocomplete="off" spellcheck="false" data-pw></label>`).join("")}${inputs.length ? '<label class="chk"><input type="checkbox" onchange="showPw(this)">Show password</label>' : ""}<div style="display:flex;gap:10px;justify-content:flex-end">${cancel ? '<button class="g" data-c>Cancel</button>' : ""}<button data-ok>OK</button></div></div>`;
    const done = v => { d.remove(); res(v); };
    d.querySelector("[data-ok]").onclick = () => done(inputs.length ? [...d.querySelectorAll("input")].map(i => i.value) : true);
    d.querySelector("[data-c]")?.addEventListener("click", () => done(null));
    document.body.append(d); (d.querySelector("input") || d.querySelector("[data-ok]")).focus();
  });
}
function showPw(cb) { cb.closest(".card").querySelectorAll("[data-pw]").forEach(i => i.classList.toggle("mask", !cb.checked)); }
const confirmBox = text => dialog({ text }).then(v => !!v);
window.alert = m => { dialog({ text: String(m), cancel: false }); };
async function changePw() {
  const v = await dialog({ title: "Change password", inputs: ["Current password", "New password (at least 6 characters)"] });
  if (!v) return;
  try { await api("password", "POST", { old: v[0], new: v[1] }); toast("Password changed"); } catch (x) { alert(x.message); }
}

const tab = {}, teacherNav = [["home","Overview","▦"],["exams","Create exam","✎"],["mine","My exams","☰"],["grade","Grading","✓"],["results","Results","▤"],["courses","Courses","⌂"]],
  adminNav = [["home","Overview","▦"],["users","Users","☺"],["courses","Courses","⌂"],["settings","Settings","⚙"],["results","Results","▤"]], studentNav = [["home","Exams","☰"],["results","My results","▤"]];
const greet = () => { const h = new Date().getHours(); return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening"; };
const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : 0, isPass = r => r.passed ?? pc(r) >= 50;
function toggleTheme() { const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = t; localStorage.setItem("theme", t); }
function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), 2600); }
function setTab(k) { tab[me.role] = k; document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.dataset.p === k)); document.querySelectorAll(".nv[data-t]").forEach(b => b.classList.toggle("on", b.dataset.t === k)); scrollTo(0, 0); }
const statBox = r => `<div class="stats">${r.map(([n, l]) => `<div><b>${n}</b>${l}</div>`).join("")}</div>`;
const tStats = (ex, rs, pend) => { const g = rs.filter(r => !r.pending); return statBox([[ex.length, "Exams"], [rs.length, "Attempts"], [g.length ? avg(g.map(pc)) + "%" : "–", "Average score"], [g.length ? Math.round(g.filter(isPass).length / g.length * 100) + "%" : "–", "Pass rate"], [pend.length, "To grade"]]); };
const sStats = (ex, rs) => { const g = rs.filter(r => !r.pending); return statBox([[ex.filter(x => x.status !== "done").length, "Open exams"], [rs.length, "Completed"], [g.length ? avg(g.map(pc)) + "%" : "–", "Average"], [g.length ? Math.max(...g.map(pc)) + "%" : "–", "Best score"]]); };
function scoreChart(rs) {
  const g = rs.filter(r => !r.pending); if (!g.length) return "";
  const b = [["0–39%", 0, 39], ["40–59%", 40, 59], ["60–79%", 60, 79], ["80–100%", 80, 100]].map(([l, a, z]) => [l, g.filter(r => pc(r) >= a && pc(r) <= z).length]), m = Math.max(...b.map(x => x[1]), 1);
  return `<div class="card"><h3>Score distribution</h3>${b.map(([l, n]) => `<div class="bar"><span>${l}</span><i style="--w:${n / m * 100}%"></i><b>${n}</b></div>`).join("")}</div>`;
}
function filt(el) { const q = el.value.toLowerCase(); el.nextElementSibling.querySelectorAll("tr").forEach((r, i) => { if (i) r.hidden = !r.textContent.toLowerCase().includes(q); }); }
function filtItems(el) { const q = el.value.toLowerCase(); el.parentNode.querySelectorAll(".item").forEach(r => r.hidden = !r.textContent.toLowerCase().includes(q)); }
function chip(b, s) { b.parentNode.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); document.querySelectorAll(".item[data-s]").forEach(i => i.hidden = !!s && i.dataset.s !== s); }
async function signup() {
  try { await api("signup", "POST", { name: $("su_name").value, username: $("su_user").value, password: $("su_pass").value }); loginView(); toast("Account created. Log in to continue."); }
  catch (x) { $("su_err").textContent = x.message; }
}
document.addEventListener("keydown", e => {
  if (!cur || cur.done || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === "ArrowRight" && cur.i < cur.qs.length - 1) goQ(cur.i + 1); else if (e.key === "ArrowLeft" && cur.i > 0) goQ(cur.i - 1); else if (e.key.toLowerCase() === "f") toggleFlag();
});
function shell(title, html, navs) {
  document.body.className = "";
  if (!navs) { app.innerHTML = `<div class="focus"><div class="top"><h1>${title}</h1><button class="g" onclick="toggleTheme()">Theme</button></div>${html}</div>`; return; }
  const k = navs.some(n => n[0] === tab[me.role]) ? tab[me.role] : navs[0][0];
  app.innerHTML = `<div class="shell"><aside class="side"><div class="brand"><span class="mono">BHU</span><b>Exam Portal</b></div>${navs.map(n => `<button class="nv" data-t="${n[0]}" onclick="setTab('${n[0]}')"><i>${n[2]}</i><span>${n[1]}</span></button>`).join("")}<span class="grow"></span><button class="nv" onclick="toggleTheme()"><i>◐</i><span>Theme</span></button><button class="nv" onclick="changePw()"><i>⚿</i><span>Password</span></button><button class="nv" onclick="logout()"><i>⏻</i><span>Log out</span></button></aside>
  <div class="main"><header class="hd"><div><p class="muted">${greet()}, ${esc(me.name).split(" ")[0]}</p><h1>${title}</h1></div><span class="pill">${me.role}</span></header>${html}</div></div>`;
  setTab(k);
}
function home() { if (!me) return loginView(); ({ admin: adminView, teacher: teacherView, student: studentView })[me.role]().catch(x => alert(x.message)); }
function loginView() { document.body.className = "auth";
    app.innerHTML = `
    
        <div class="card" style="text-align: center; max-width: 380px; margin: 0 auto; padding: 30px 24px;">
            <img src="/logo.jpg" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <h1 id="sn" style="font-size: 1.3rem; color: #0f2b48; font-weight: 700; margin-bottom: 4px;">BULE HORA UNIVERSITY</h1>
            <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 20px;">Online Examination Portal</p>
            
            <div style="text-align: left; max-width: 260px; margin: 0 auto;">
                <label>Username / Student ID</label>
                <input id="u" name="username" placeholder="Enter username" autocomplete="username">
                
                <label>Password</label>
                <div class="pw-container">
                    <input id="p" type="password" name="password" placeholder="Enter password" autocomplete="current-password">
                    <button type="button" class="pw-toggle" onclick="togglePassword('p', this)">SHOW</button>
                </div>
                
                <button class="btn-primary" onclick="login()">Log In</button>
            </div>
            
            <p id="e" class="err" style="margin-top: 10px;"></p>

            <div style="margin-top: 16px; font-size: 0.85rem; color: #64748b;">
                Don't have an account? <a onclick="signupView()" style="color: #0f2b48; font-weight: 700; cursor: pointer; text-decoration: underline;">Sign Up</a>
            </div>
        </div>
    `;
    $("p").onkeydown = e => { if (e.key === "Enter") login(); };
    fetch("/api/public").then(r => r.json()).then(d => { if (d.siteName) $("sn").textContent = d.siteName; }).catch(() => {});
}

 
async function login() {
  try { me = await api("login", "POST", { username: $("u").value, password: $("p").value }); localStorage.setItem("me", JSON.stringify(me)); home(); }
  catch (x) { $("e").textContent = x.message; }
}
function resTable(rs, showStudent = true) {
  lastRs = rs;
  return rs.length ? `<input class="search" placeholder="Search by student, exam or result" oninput="filt(this)"><div style="overflow-x:auto"><table><tr>${showStudent ? "<th>Student</th>" : ""}<th>Exam</th><th>Score</th><th>Result</th><th>Warnings</th>${showStudent ? "<th>Photos</th>" : ""}${showStudent && me.role === "teacher" ? "<th>Retake</th>" : ""}${!showStudent ? "<th></th>" : ""}</tr>${rs.map(r =>
    `<tr>${showStudent ? `<td>${esc(r.student)}</td>` : ""}<td>${esc(r.exam)}${r.course ? ` <span class="muted">(${esc(r.course)})</span>` : ""}</td><td>${r.score}/${r.total} (${pc(r)}%)</td>
    <td class="${r.pending ? "muted" : (r.passed ?? pc(r) >= 50) ? "pass" : "fail"}">${r.pending ? "Pending" : (r.passed ?? pc(r) >= 50) ? "Pass" : "Fail"}</td><td>${r.violations || 0}</td>${showStudent ? `<td>${r.snaps ? `<button class="g" onclick="showSnaps(${r.examId},${r.studentId})">${r.snaps} photos</button>` : "–"}</td>` : ""}${showStudent && me.role === "teacher" ? `<td><button class="g" onclick="retake(${r.examId},${r.studentId})">Allow retake</button></td>` : ""}${!showStudent ? `<td><button class="g" onclick="reviewResult(${r.examId})">Review</button></td>` : ""}</tr>`).join("")}</table></div>` : `<p class="muted">No results yet.</p>`;
}
function exportCsv() {
  const rows = [["Student","Course","Exam","Score","Total","Percent","Result","Warnings","Date"], ...lastRs.map(r => [r.student, r.course || "", r.exam, r.score, r.total, pc(r), r.pending ? "Pending" : (r.passed ?? pc(r) >= 50) ? "Pass" : "Fail", r.violations || 0, r.at])];
  const b = new Blob([rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n")], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "results.csv"; a.click();
}

function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === "password") {
        input.type = "text";
        btn.textContent = "HIDE";
    } else {
        input.type = "password";
        btn.textContent = "SHOW";
    }
}

function signupView() { document.body.className = "auth";
    app.innerHTML = `
        <div class="card" style="text-align: center; max-width: 380px; margin: 0 auto; padding: 30px 24px;">
            <img src="/logo.jpg" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <h1 style="font-size: 1.3rem; color: #0f2b48; font-weight: 700; margin-bottom: 4px;">Create Account</h1>
            <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 20px;">Bule Hora University Portal</p>
            
            <div style="text-align: left; max-width: 260px; margin: 0 auto;">
                <label style="font-size: 0.8rem; font-weight: 600; display: block; margin-bottom: 4px;">Full Name</label>
                <input id="su_name" placeholder="Enter full name" style="width:100%; padding:8px; margin-bottom:10px; border:1px solid #cbd5e1; border-radius:6px;">

                <label style="font-size: 0.8rem; font-weight: 600; display: block; margin-bottom: 4px;">Username / ID</label>
                <input id="su_user" placeholder="Enter username" style="width:100%; padding:8px; margin-bottom:10px; border:1px solid #cbd5e1; border-radius:6px;">

                <label style="font-size: 0.8rem; font-weight: 600; display: block; margin-bottom: 4px;">Password</label>
                <input id="su_pass" type="password" placeholder="Enter password" style="width:100%; padding:8px; margin-bottom:14px; border:1px solid #cbd5e1; border-radius:6px;">

                <button class="btn-primary" onclick="signup()" style="width: 100%; padding: 10px; background-color: #0f2b48; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">Sign Up</button>
            </div>

            <p id="su_err" class="err" style="margin-top: 10px;"></p>

            <div style="margin-top: 16px; font-size: 0.85rem; color: #64748b;">
                Already have an account? <a onclick="loginView()" style="color: #0f2b48; font-weight: 700; cursor: pointer; text-decoration: underline;">Log In</a>
            </div>
        </div>
    `;
}

// ================= ADMIN =================
async function adminView() {
  const us = await api("users"), rs = await api("results"), st = await api("stats"), courses = await api("courses"), cfg = await api("settings"), notes = await api("notices");
  shell("Admin dashboard", `<div class="pane" data-p="home"><div class="stats"><div><b>${st.students}</b>Students</div><div><b>${st.teachers}</b>Teachers</div><div><b>${st.courses}</b>Courses</div><div><b>${st.exams}</b>Exams</div><div><b>${st.taken}</b>Attempts</div><div><b>${st.avg}%</b>Average</div></div>

function parseQs(t) {
  return parseLines(t).map(q => {
    const m = q.q.match(/^\[(img\d+|img:[^\]]+)\]\s*/);
    if (m) { q.q = q.q.slice(m[0].length); q.img = m[1].startsWith("img:") ? m[1].slice(4) : imgs[+m[1].slice(3) - 1]; if (!q.img) throw new Error("Unknown image in: " + q.q); }
    return q;
  });
}
function parseLines(t) {
  return t.split("\n").map(l => l.trim()).filter(Boolean).map(l => {
    let m;
    if ((m = l.match(/^essay:\s*(.*?)(?:\|\s*(\d+))?\s*$/i))) return { type: "essay", q: m[1].trim(), pts: +m[2] || 5 };
    if (/^multi:/i.test(l)) {
      const p = l.slice(6).split("|").map(s => s.trim()), a = p.pop().split(",").map(n => +n - 1);
      if (p.length < 3 || a.some(i => !(i >= 0 && i < p.length - 1))) throw new Error("Check this line: " + l);
      return { type: "multi", q: p[0], o: p.slice(1), a };
    }
    if (l.includes("=") && !l.includes("|")) { const [q, ...r] = l.split("="), a = r.join("=").trim(); if (!q.trim() || !a) throw new Error("Check this line: " + l); return { type: "text", q: q.trim(), a }; }
    const p = l.split("|").map(s => s.trim());
    if (p.length === 2 && /^(true|false)$/i.test(p[1])) return { type: "tf", q: p[0], o: ["True", "False"], a: /^true$/i.test(p[1]) ? 0 : 1 };
    const a = +p.pop() - 1;
    if (p.length < 3 || !(a >= 0 && a < p.length - 1)) throw new Error("Check this line: " + l);
    return { type: "mcq", q: p[0], o: p.slice(1), a };
  });
}

    if (proctor && !camStream) await startCam().catch(() => { throw new Error("This exam requires your webcam. Allow camera access and try again."); });
    const d = await api(`exams/${id}/start`, "POST", { code });
    cur = { id, title: d.title, qs: d.questions, ans: d.questions.map((_, k) => d.answers?.[k] ?? null), flag: [], i: 0, viol: d.violations || 0, end: Date.now() + d.remaining * 1000 };
  } catch (x) { return alert(x.message); }

    <div class="top" style="margin-top:16px"><span><button id="prev" class="g" onclick="goQ(cur.i-1)">Previous</button> <button id="next" class="g" onclick="goQ(cur.i+1)">Next</button> <button id="fl" class="g" onclick="toggleFlag()"></button></span>
    <button onclick="submitExam(true)">Submit exam</button></div></div>`);
  renderQ(); mountCam(); clearInterval(pollT); pollT = setInterval(syncTime, 10000); clearInterval(timer);

}
function renderQ() {

    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); imgs.push(c.toDataURL("image/jpeg", 0.7));
    const t = $("qs"); t.value += (t.value && !t.value.endsWith("\n") ? "\n" : "") + `[img${imgs.length}] `; $("qd").open = true; t.focus();
    $("info").textContent = `Image saved as [img${imgs.length}]. Finish that line with your question.`;
  };
  im.src = URL.createObjectURL(f); inp.value = "";
}
function csvRows(t) {
  const rows = []; let r = [], c = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"' && t[i + 1] === '"') { c += '"'; i++; } else if (ch === '"') q = false; else c += ch; }
    else if (ch === '"') q = true; else if (ch === ",") { r.push(c); c = ""; }
    else if (ch === "\n") { r.push(c); rows.push(r); r = []; c = ""; } else if (ch !== "\r") c += ch;
  }
  r.push(c); rows.push(r); return rows;
}
async function importQs(inp) {
  const f = inp.files[0]; if (!f) return; let rows;
  try {
    if (/\.xlsx$/i.test(f.name)) {
      if (!window.XLSX) await new Promise((ok, no) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = ok; s.onerror = () => no(new Error("Excel reader needs internet. Save the file as CSV and import that instead.")); document.head.append(s); });
      const wb = XLSX.read(await f.arrayBuffer()); rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
    } else rows = csvRows(await f.text());
    const lines = rows.slice(1).map(r => Array.from({ length: 7 }, (_, i) => String(r[i] ?? "").trim())).filter(r => r[1]).map(([t, q, a, b, c, d, ans]) => {
      q = q.replace(/\|/g, "/"); t = t.toLowerCase();
      return t === "text" ? `${q} = ${ans}` : t === "tf" ? `${q} | ${ans}` : `${q} | ${[a, b, c, d].filter(Boolean).join(" | ")} | ${ans}`;
    });
    const ta = $("qs"); ta.value += (ta.value && !ta.value.endsWith("\n") ? "\n" : "") + lines.join("\n");
    $("info").textContent = `${lines.length} question(s) imported. Check them below, then create the exam.`; $("m").textContent = "";
  } catch (x) { $("m").textContent = x.message; }
  inp.value = "";
}
function csvTemplate() {
  const t = 'Type,Question,Option1,Option2,Option3,Option4,Answer\nmcq,What is 12 x 8?,96,88,108,86,1\ntf,The Earth is flat,,,,,false\ntext,Capital of Ethiopia,,,,,Addis Ababa\n';
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([t], { type: "text/csv" })); a.download = "questions-template.csv"; a.click();
}
function addFromBank() {
  const s = $("bs").value, n = Math.max(1, +$("bn").value || 5), pool = bankCache.filter(b => b.subject === s && !extra.includes(b.q));
  if (!pool.length) { $("info").textContent = "No more questions in that subject."; return; }
  extra.push(...pool.sort(() => Math.random() - .5).slice(0, n).map(b => b.q));
  $("info").textContent = `${extra.length} question(s) added from the bank.`; renderDraft();
}
async function delBank(s) { if (await confirmBox(`Delete all "${s}" questions from your bank?`)) { for (const b of bankCache.filter(x => x.subject === s)) await api("bank/" + b.id, "DELETE"); teacherView(); } }

// ---- Question builder (all question types) ----
const typeName = { mcq: "Multiple choice", multi: "Several answers", tf: "True/False", text: "Short answer", essay: "Essay" };
const wordCount = t => (String(t ?? "").trim().match(/\S+/g) || []).length;
function toggleMulti(j, on) { const s = new Set(cur.ans[cur.i] || []); on ? s.add(j) : s.delete(j); cur.ans[cur.i] = [...s].sort((a, b) => a - b); persist(); nav(); }
let bImgData = null;
function bType() {
  const t = $("bt").value, opt = (i, kind) => `<div style="display:flex;gap:8px;align-items:center"><input type="${kind}" class="bk" name="bc" value="${i}" style="width:auto;margin:0"><input class="bo" placeholder="Option ${"ABCDEF"[i]}" style="margin:4px 0"></div>`;
  $("bf").innerHTML = t === "mcq" || t === "multi"
    ? `<p class="muted">${t === "mcq" ? "Tick the one correct option." : "Tick every correct option."} Leave unused options empty.</p>` + [0, 1, 2, 3, 4, 5].map(i => opt(i, t === "mcq" ? "radio" : "checkbox")).join("")
    : t === "tf" ? `<label class="chk"><input type="radio" name="tf" value="true" checked>True</label><label class="chk"><input type="radio" name="tf" value="false">False</label>`
    : t === "text" ? `<label>Accepted answer(s) - separate several with |<input id="ba" placeholder="e.g. Addis Ababa | Addis Abeba"></label>`
    : `<label>Marking guide / model answer (only teachers see this)<textarea id="bg" rows="3"></textarea></label>`;
  $("bp").value = t === "essay" ? 5 : 1;
}
function bImg(inp) {
  const f = inp.files[0]; if (!f) return; const im = new Image();
  im.onload = () => { const k = Math.min(1, 700 / im.width), c = document.createElement("canvas"); c.width = im.width * k; c.height = im.height * k;
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); bImgData = c.toDataURL("image/jpeg", 0.7); $("bi").textContent = "Image attached"; };
  im.src = URL.createObjectURL(f); inp.value = "";
}
function bAdd() {
  try {
    const type = $("bt").value, q = $("bq").value.trim(), item = { type, q, pts: Math.max(1, +$("bp").value || 1) };
    if (!q) throw new Error("Write the question first");
    if (type === "mcq" || type === "multi") {
      const txt = [...document.querySelectorAll(".bo")].map(i => i.value.trim()), on = [...document.querySelectorAll(".bk")].map(i => i.checked);
      const keep = txt.map((t, i) => t ? i : -1).filter(i => i >= 0);
      if (keep.length < 2) throw new Error("Give at least two options");
      const right = keep.map((i, k) => on[i] ? k : -1).filter(k => k >= 0);
      if (!right.length) throw new Error("Tick the correct answer");
      item.o = keep.map(i => txt[i]); item.a = type === "mcq" ? right[0] : right;
    } else if (type === "tf") { item.o = ["True", "False"]; item.a = document.querySelector("input[name=tf]:checked").value === "true" ? 0 : 1; }
    else if (type === "text") { item.a = $("ba").value.split("|").map(s => s.trim()).filter(Boolean); if (!item.a.length) throw new Error("Enter the accepted answer"); }
    else item.guide = $("bg").value.trim();
    if ($("bx").value.trim()) item.explain = $("bx").value.trim();
    if (bImgData) item.img = bImgData;
    if (bEditIdx !== null) { extra[bEditIdx] = item; bEditIdx = null; $("badd").textContent = "Add question to exam"; } else extra.push(item);
    bImgData = null; $("bi").textContent = ""; $("bq").value = ""; $("bx").value = ""; $("bm").textContent = "";
    bType(); renderDraft();
  } catch (x) { $("bm").textContent = x.message; }
}
function renderDraft() {
  $("draft").innerHTML = extra.length ? `<h4>Questions in this exam (${extra.length})</h4>` + extra.map((q, i) =>
    `<div class="item"><span>${i + 1}. ${esc(q.q)} <span class="pill">${typeName[q.type || "mcq"]} · ${q.pts || 1} pt</span>${q.img ? " (image)" : ""}</span><span><button class="g" onclick="bEdit(${i})">Edit</button> <button class="g" onclick="bMove(${i},-1)" aria-label="Move up">↑</button> <button class="g" onclick="bMove(${i},1)" aria-label="Move down">↓</button> <button class="g" onclick="bRemove(${i})">Remove</button></span></div>`).join("") : "";
}
async function gradeEssay(e, s, k, max) {
  const v = $(`g${e}_${s}_${k}`).value;
  if (v === "" || +v < 0 || +v > max) return alert(`Enter a mark from 0 to ${max}`);
  try { await api("grade", "POST", { examId: e, studentId: s, k, mark: +v, feedback: $(`f${e}_${s}_${k}`).value }); teacherView(); } catch (x) { alert(x.message); }
}

// ---- Courses, settings, bulk import ----
function courseCard(courses, teachers, admin) {
  return `<div class="card"><h3>Courses</h3>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><input id="cn" placeholder="Course name" style="flex:2;min-width:160px"><input id="cc" placeholder="Code" style="flex:1;min-width:90px">
  ${admin ? `<select id="ct" style="flex:2;min-width:140px">${teachers.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select>` : ""}</div>
  <p id="cm" class="err"></p><button onclick="addCourse(${admin})">Create course</button>
  ${courses.map(k => `<div class="rv"><div class="top"><b>${esc(k.name)} <span class="muted">${esc(k.code)}${admin ? " · " + esc(k.teacher) : ""} · ${k.count} students</span></b>

}
async function addCourse(admin) {
  try { await api("courses", "POST", { name: $("cn").value, code: $("cc").value, teacherId: admin ? $("ct").value : undefined }); home(); }
  catch (x) { $("cm").textContent = x.message; }
}
async function delCourse(id) { if (await confirmBox("Delete this course? Its exams stay, but become open to all students.")) { await api("courses/" + id, "DELETE"); home(); } }
async function enroll(id, all) {
  const usernames = ($("en" + id).value || "").split(/[\n,;]+/).map(x => x.trim()).filter(Boolean);
  try { const r = await api(`courses/${id}/enroll`, "POST", { usernames, all: !!all }); home(); alert(`${r.added} student(s) enrolled.` + (r.missing.length ? ` Not found: ${r.missing.join(", ")}` : "")); }

}
async function unenroll(cid, sid) { await api(`courses/${cid}/students/${sid}`, "DELETE"); home(); }
async function saveSettings() {
  try { await api("settings", "PUT", { siteName: $("sn2").value, minutes: $("sm").value, pass: $("sp").value, shuffle: $("ss").checked, showAnswers: $("sa2").checked }); toast("Settings saved"); }
  catch (x) { $("sm2").textContent = x.message; }
}
async function bulkAdd() {
  const users = $("bulk").value.split("\n").map(l => l.split(/\t|,/).map(x => x.trim())).filter(p => p.length >= 3 && p[0]).map(p => ({ name: p[0], username: p[1], password: p.slice(2).join(",") }));
  if (!users.length) { $("bm2").textContent = "Use the format: Full name, username, password"; return; }
  try { const r = await api("users/bulk", "POST", { users, courseId: $("bc2").value }); home(); alert(`${r.created} student(s) added.` + (r.skipped.length ? ` Skipped (duplicate or invalid): ${r.skipped.join(", ")}` : "")); }
  catch (x) { $("bm2").textContent = x.message; }
}

// ---- Live monitor, time control, announcements ----
let pollT, liveT;
async function syncTime() {   // student: pick up time changes made by the teacher
  if (!cur || cur.done) return clearInterval(pollT);
  try {
    const r = await api(`exams/${cur.id}/remaining`), was = Math.round((cur.end - Date.now()) / 1000);
    cur.end = Date.now() + r.remaining * 1000;
    if (Math.abs(r.remaining - was) > 30) $("warn").textContent = "Your teacher changed the time. Time left: " + Math.ceil(r.remaining / 60) + " min.";
    if (r.remaining <= 0) submitExam(false);
  } catch {}
}
async function loadLive() {
  const box = $("live"); if (!box) return clearInterval(liveT);
  try {
    const d = await api("live"), fmt = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    box.innerHTML = d.length ? d.map(e => `<div class="rv"><div class="top"><b>${esc(e.title)} <span class="muted">· ${e.students.length} in progress · ${e.minutes} min total</span></b>
      <span>Everyone: ${[-5, 5, 10, 15].map(n => `<button class="g" onclick="adjustTime(${e.examId},${n})">${n > 0 ? "+" : ""}${n}</button>`).join("")}</span></div>
      <div style="overflow-x:auto"><table><tr><th>Student</th><th>Time left</th><th>Answered</th><th>Warnings</th><th>This student</th></tr>${e.students.map(s => `<tr><td>${esc(s.student)}</td><td>${fmt(s.remaining)}</td><td>${s.answered}/${s.total}</td><td>${s.violations}</td>
      <td>${[-5, 5, 10].map(n => `<button class="g" onclick="adjustTime(${e.examId},${n},${s.studentId})">${n > 0 ? "+" : ""}${n}</button>`).join("")}</td></tr>`).join("")}</table></div></div>`).join("")
      : '<span class="muted">Nobody is taking an exam right now.</span>';
  } catch {}
}
async function adjustTime(examId, minutes, studentId) {
  const who = studentId ? "this student" : "everyone in this exam (this also changes the exam's total time)";
  if (!(await confirmBox(`${minutes > 0 ? "Add" : "Remove"} ${Math.abs(minutes)} minute(s) for ${who}?`))) return;
  try { await api(`exams/${examId}/time`, "POST", { minutes, studentId }); loadLive(); } catch (x) { alert(x.message); }
}
function noticeList(nt) {
  return nt.length ? `<div class="card"><h3>Announcements</h3>${nt.map(n => `<div class="rv"><b>${esc(n.author)}</b> <span class="muted">${n.course ? esc(n.course) + " · " : ""}${new Date(n.at).toLocaleString()}</span><br>${esc(n.text)}</div>`).join("")}</div>` : "";
}
function noticeCard(courses, notes) {
  return `<div class="card"><h3>Announcements</h3><textarea id="nt" rows="2" placeholder="Message for your students"></textarea>
  <label>Send to<select id="nc"><option value="">All students</option>${courses.map(k => `<option value="${k.id}">${esc(k.name)}</option>`).join("")}</select></label>
  <p id="nm" class="err"></p><button onclick="postNotice()">Post announcement</button>
  ${notes.map(n => `<div class="item"><span>${esc(n.text)} <span class="muted">· ${n.course ? esc(n.course) : "All"} · ${new Date(n.at).toLocaleDateString()}</span></span><button class="g" onclick="delNotice(${n.id})">Delete</button></div>`).join("")}</div>`;
}
async function postNotice() { try { await api("notices", "POST", { text: $("nt").value, courseId: $("nc").value || null }); home(); } catch (x) { $("nm").textContent = x.message; } }
async function delNotice(id) { await api("notices/" + id, "DELETE"); home(); }

// ---- Edit exam, move/edit questions, allow retake ----
let myExams = [], editId = null, bEditIdx = null;
function editExam(id) {
  const x = myExams.find(e => e.id === id); if (!x) return;
  const ts = v => v ? new Date(v - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16) : "";
  setTab("exams"); editId = id; extra = JSON.parse(JSON.stringify(x.questions)); bEditIdx = null;
  $("t").value = x.title; $("xc").value = x.courseId || ""; $("mi").value = x.minutes; $("ps").value = x.pass ?? 50;
  $("sh").checked = !!x.shuffle; $("sa").checked = !!x.showAnswers; $("pr").checked = !!x.proctor; $("op").value = ts(x.opensAt); $("cl").value = ts(x.closesAt);
  $("ac").value = x.code || ""; $("pk").value = x.pick || ""; $("qs").value = ""; $("sb").checked = false; $("info").textContent = "Editing - change anything, then press Save changes.";
  $("title2").textContent = "Edit exam: " + x.title; $("cb").textContent = "Save changes"; $("cx").hidden = false;
  renderDraft(); $("title2").scrollIntoView({ behavior: "smooth" });
}
function bMove(i, d) { const j = i + d; if (j < 0 || j >= extra.length) return; [extra[i], extra[j]] = [extra[j], extra[i]]; bEditIdx = null; renderDraft(); }
function bRemove(i) { extra.splice(i, 1); bEditIdx = null; renderDraft(); }
function bEdit(i) {
  const q = extra[i]; bEditIdx = i; $("bt").value = q.type || "mcq"; bType();
  $("bq").value = q.q; $("bx").value = q.explain || ""; $("bp").value = q.pts || 1; bImgData = q.img || null; $("bi").textContent = q.img ? "Image attached" : "";
  if (!q.type || q.type === "mcq" || q.type === "multi") {
    document.querySelectorAll(".bo").forEach((inp, k) => { inp.value = q.o[k] || ""; });
    document.querySelectorAll(".bk").forEach((inp, k) => { inp.checked = [].concat(q.a).includes(k); });
  } else if (q.type === "tf") document.querySelector(`input[name=tf][value=${q.a === 0 ? "true" : "false"}]`).checked = true;
  else if (q.type === "text") $("ba").value = [].concat(q.a).join(" | ");
  else $("bg").value = q.guide || "";
  $("badd").textContent = "Update question"; $("bq").scrollIntoView({ behavior: "smooth" });
}
async function retake(e, s) {
  if (!(await confirmBox("Delete this student's result so they can take the exam again? The old result will be lost."))) return;
  try { await api(`exams/${e}/reset`, "POST", { studentId: s }); teacherView(); } catch (x) { alert(x.message); }
}

// ---- Exams grouped by course, review, analysis, copy ----
function myExamsCard(ex, courses, st) {
  const item = x => `<div class="item"><span><b>${esc(x.title)}</b><br><span class="muted">${x.questions.length} questions · ${x.minutes} min · pass ${x.pass ?? 50}%${x.code ? " · code: " + esc(x.code) : ""}${x.pick ? " · random " + x.pick : ""}<br>${st(x.id)}</span></span>
    <span><button class="g" onclick="showAnalysis(${x.id})">Analysis</button> <button class="g" onclick="editExam(${x.id})">Edit</button> <button class="g" onclick="dupExam(${x.id})">Copy</button> <button class="g" onclick="delExam(${x.id})">Delete</button></span></div>`;
  const grp = (title, list, cid) => `<div class="card"><div class="top"><h3>${title}</h3><button class="g" onclick="newExamIn(${cid})">+ New exam</button></div>${list.length ? list.map(item).join("") : '<p class="muted">No exams yet.</p>'}</div>`;
  const loose = ex.filter(x => !courses.some(k => k.id === x.courseId));
  return courses.map(k => grp(`${esc(k.name)} <span class="muted">${esc(k.code)}</span>`, ex.filter(x => x.courseId === k.id), k.id)).join("") + (loose.length || !courses.length ? grp("Exams without a course", loose, 0) : "");
}
function newExamIn(cid) { setTab("exams"); $("xc").value = cid || ""; $("title2").scrollIntoView({ behavior: "smooth" }); $("t").focus(); }
function dupExam(id) {
  editExam(id); editId = null; $("t").value += " (copy)"; $("title2").textContent = "New exam (copy)"; $("cb").textContent = "Create exam";
  $("info").textContent = "Copy loaded - change what you need, then press Create exam.";
}
async function showAnalysis(id) {
  try {
    const rows = await api("analysis/" + id), d = document.createElement("div");
    d.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.75);overflow:auto;padding:20px;z-index:9";
    d.innerHTML = `<div class="card" style="max-width:720px;margin:0 auto"><div class="top"><h3>Question analysis</h3><button onclick="this.parentNode.parentNode.parentNode.remove()">Close</button></div>
    <p class="muted">Share of students who got each question right. Very low = too hard or unclear; very high = too easy.</p>
    ${rows.map(r => `<div class="rv"><b>${r.qi + 1}. ${esc(r.q)}</b><br><span class="muted">${r.n} answered</span> · <b class="${r.pct === null ? "muted" : r.pct >= 60 ? "pass" : "fail"}">${r.pct === null ? "no data" : r.pct + "%"}</b></div>`).join("")}</div>`;
    document.body.append(d);
  } catch (x) { alert(x.message); }
}
async function reviewResult(id) {
  try {
    const r = await api("review/" + id);
    shell("Review: " + esc(r.exam), `<div class="card"><p class="big ${r.passed ? "pass" : "fail"}">${r.percent}%</p><p>${r.pending ? "<b>Awaiting grading</b> · " : ""}${r.score} of ${r.total} points</p>
    ${r.review ? r.review.map((x, i) => `<div class="rv"><b>${i + 1}. ${esc(x.q)}</b> <span class="muted">(${x.pts} pt)</span><br>
      <span class="${x.ok === null ? "muted" : x.ok ? "pass" : "fail"}">Your answer: ${esc(x.yours)}</span>${x.ok === false ? `<br>Correct answer: ${esc(x.right)}` : ""}
      ${x.mark !== undefined ? `<br>Mark: <b>${x.mark === null ? "not graded yet" : x.mark + " / " + x.max}</b>${x.feedback ? `<br>Teacher feedback: ${esc(x.feedback)}` : ""}` : ""}
      ${x.explain ? `<br><span class="muted">Explanation: ${esc(x.explain)}</span>` : ""}</div>`).join("") : '<p class="muted">The question review is not available for this exam.</p>'}
    <p><button onclick="studentView()">Back</button></p></div>`);
  } catch (x) { alert(x.message); }
}

// ---- Anti-cheat: tab switching and copy/paste ----
document.addEventListener("visibilitychange", () => {
  if (!cur || cur.done || !document.hidden) return;
  cur.viol++; persist();
  $("warn").textContent = `Warning ${cur.viol}/3: you left the exam tab. At 3 warnings the exam is submitted automatically.`;
  if (cur.viol >= 3) submitExam(false);
});
["copy", "cut", "paste", "contextmenu"].forEach(t => document.addEventListener(t, e => { if (cur && !cur.done) e.preventDefault(); }));

home();
</script>
