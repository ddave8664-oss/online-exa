<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Exam Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f2b48;
            --primary-hover: #163d66;
            --bg-color: #f4f7fa;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --error-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #app {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid #e2e8f0;
            padding: 36px 32px;
        }

        .header-logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .header-logo h1 {
            color: var(--primary);
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .header-logo p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            outline: none;
            background-color: #fff;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(15, 43, 72, 0.12);
        }

        .pw-container {
            position: relative;
        }

        .pw-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        button.btn-primary {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 10px;
        }

        button.btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .toggle-link {
            text-align: center;
            margin-top: 22px;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .toggle-link a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .toggle-link a:hover {
            text-decoration: underline;
        }

        .err {
            color: var(--error-color);
            font-size: 0.85rem;
            margin-top: 12px;
            text-align: center;
        }

        .success {
            color: var(--success-color);
            font-size: 0.85rem;
            margin-top: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const $ = id => document.getElementById(id);

        async function api(url, method = "GET", body = null) {
            const opts = { method, headers: { "Content-Type": "application/json" } };
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(url, opts);
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "An error occurred");
            return data;
        }

        function togglePassword(inputId, btn) {
            const input = $(inputId);
            if (input.type === "password") {
                input.type = "text";
                btn.textContent = "Hide";
            } else {
                input.type = "password";
                btn.textContent = "Show";
            }
        }

        function loginView() {
            $("app").innerHTML = `
                <div class="card">
                    <div class="header-logo">
                        <h1 id="sn">Online Exam Portal</h1>
                        <p>Sign in to start your examination session</p>
                    </div>

                    <div class="form-group">
                        <label for="u">Username or ID</label>
                        <input id="u" name="username" placeholder="Enter your username" autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="p">Password</label>
                        <div class="pw-container">
                            <input id="p" type="password" name="password" placeholder="Enter your password" autocomplete="current-password">
                            <button type="button" class="pw-toggle" onclick="togglePassword('p', this)">Show</button>
                        </div>
                    </div>

                    <button class="btn-primary" onclick="login()">Log In</button>
                    <p id="e" class="err"></p>

                    <div class="toggle-link">
                        Don't have an account? <a onclick="signupView()">Sign Up</a>
                    </div>
                </div>
            `;
            $("p").onkeydown = e => e.key === "Enter" && login();
            fetch("/api/public").then(r => r.json()).then(d => { 
                if(d.siteName) $("sn").textContent = d.siteName; 
            }).catch(() => {});
        }

        function signupView() {
            $("app").innerHTML = `
                <div class="card">
                    <div class="header-logo">
                        <h1>Create Account</h1>
                        <p>Register your student or instructor account</p>
                    </div>

                    <div class="form-group">
                        <label for="fn">Full Name</label>
                        <input id="fn" placeholder="e.g. Chala Bekele">
                    </div>

                    <div class="form-group">
                        <label for="su">Username / ID</label>
                        <input id="su" placeholder="Choose a username or ID">
                    </div>

                    <div class="form-group">
                        <label for="sp">Password</label>
                        <div class="pw-container">
                            <input id="sp" type="password" placeholder="Create a password">
                            <button type="button" class="pw-toggle" onclick="togglePassword('sp', this)">Show</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="r">Role</label>
                        <select id="r">
                            <option value="student">Student</option>
                            <option value="teacher">Teacher / Instructor</option>
                        </select>
                    </div>

                    <button class="btn-primary" onclick="register()">Create Account</button>
                    <p id="se" class="err"></p>

                    <div class="toggle-link">
                        Already have an account? <a onclick="loginView()">Log In</a>
                    </div>
                </div>
            `;
        }

        async function login() {
            try {
                const me = await api("/login", "POST", { username: $("u").value, password: $("p").value });
                localStorage.setItem("me", JSON.stringify(me));
                alert("Login successful!");
            } catch (x) {
                $("e").textContent = x.message;
            }
        }

        async function register() {
            const name = $("fn").value;
            const username = $("su").value;
            const password = $("sp").value;
            const role = $("r").value;

            if (!name || !username || !password) {
                $("se").className = "err";
                $("se").textContent = "Please fill in all required fields.";
                return;
            }

            try {
                await api("/api/register", "POST", { name, username, password, role });
                $("se").className = "success";
                $("se").textContent = "Account created successfully! Redirecting to login...";
                setTimeout(() => loginView(), 1500);
            } catch (x) {
                $("se").className = "err";
                $("se").textContent = x.message || "Registration failed.";
            }
        }

        loginView();
    </script>
</body>
</html>
