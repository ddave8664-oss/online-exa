<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam System</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14213d;--muted:#5b6578;--line:#d5dbe4;--acc:#0f6b5e;--onacc:#fff;--bad:#c0392b;--warn:#b4540a}
@media(prefers-color-scheme:dark){:root{--bg:#0e1522;--card:#17212f;--ink:#e8edf5;--muted:#9aa6ba;--line:#2a374a;--acc:#4cc3ad;--onacc:#06201b;--bad:#ef7b7b;--warn:#f0a35a}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,serif}
main{max-width:760px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
input,textarea,select{width:100%;padding:9px;margin:4px 0 12px;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;box-sizing:border-box}
button{font:inherit;padding:8px 16px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:var(--onacc);cursor:pointer}
button.g{background:none;color:var(--acc)} button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:6px;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.err{color:var(--bad);min-height:1.4em;margin:0 0 8px}.muted{color:var(--muted)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pill{padding:2px 10px;border:1px solid var(--line);border-radius:99px;font-size:.85rem}
.pass{color:var(--acc)}.fail{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.stats b{display:block;font-size:1.6rem}
label.o{display:block;padding:10px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;cursor:pointer}
label.o:has(input:checked){border-color:var(--acc)}
label.o input,label.chk input{width:auto;margin:0 8px 0 0}
label.chk{display:inline-block;margin-right:16px}
#nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
#nav button{width:36px;height:36px;padding:0;background:none;color:var(--ink);border-color:var(--line)}
#nav button.ans{background:var(--line)}#nav button.cur{border:2px solid var(--acc)}#nav button.flag{border:2px dashed var(--warn)}
#tm{font-variant-numeric:tabular-nums;font-weight:bold}#tm.low{color:var(--warn)}
#warn{color:var(--warn);min-height:1.4em}
.big{font-size:3rem;margin:0}
.rv{padding:8px 0;border-bottom:1px solid var(--line)}
.mask{-webkit-text-security:disc;text-security:disc}
</style>
</head>
<body>
<main id="app"></main>
<script>
const $ = id => document.getElementById(id), app = $("app");
let me = JSON.parse(localStorage.getItem("me") || "null"), timer, cur = null, lastRs = [], saveT;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pc = r => r.percent ?? Math.round(r.score / r.total * 100);
const filled = a => a !== null && a !== undefined && a !== "" && !(Array.isArray(a) && !a.length);

async function api(path, method = "GET", body) {
  let r, d;
  try { r = await fetch("/api/" + path, { method, headers: { "Content-Type": "application/json", "x-token": me?.token || "" }, body: body ? JSON.stringify(body) : undefined }); d = await r.json(); }
  catch { throw new Error("Cannot reach the server. Run npm start and open http://localhost:3000"); }
  if (r.status === 403 && path !== "login") { logout(); throw new Error("Please log in again"); }
  if (!r.ok) throw new Error(d.error || "Error");
  return d;
}
function logout() { clearInterval(timer); stopCam(); $("cam")?.remove(); cur = null; localStorage.removeItem("me"); me = null; home(); }
// ---- In-page dialogs (browsers like VS Code Simple Browser block prompt/confirm) ----
function dialog({ title = "", text = "", inputs = [], cancel = true }) {
  return new Promise(res => {
    const d = document.createElement("div");
    d.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:99";
    d.innerHTML = `<div class="card" style="max-width:420px;width:100%;margin:0"><h3 style="margin-top:0">${esc(title)}</h3><p style="white-space:pre-line">${esc(text)}</p>${inputs.map(l => `<label>${esc(l)}<input type="text" class="mask" autocomplete="off" spellcheck="false" data-pw></label>`).join("")}${inputs.length ? '<label class="chk"><input type="checkbox" onchange="showPw(this)">Show password</label>' : ""}<div style="display:flex;gap:10px;justify-content:flex-end">${cancel ? '<button class="g" data-c>Cancel</button>' : ""}<button data-ok>OK</button></div></div>`;
    const done = v => { d.remove(); res(v); };
    d.querySelector("[data-ok]").onclick = () => done(inputs.length ? [...d.querySelectorAll("input")].map(i => i.value) : true);
    d.querySelector("[data-c]")?.addEventListener("click", () => done(null));
    document.body.append(d); (d.querySelector("input") || d.querySelector("[data-ok]")).focus();
  });
}
function showPw(cb) { cb.closest(".card").querySelectorAll("[data-pw]").forEach(i => i.classList.toggle("mask", !cb.checked)); }
const confirmBox = text => dialog({ text }).then(v => !!v);
window.alert = m => { dialog({ text: String(m), cancel: false }); };
async function changePw() {
  const v = await dialog({ title: "Change password", inputs: ["Current password", "New password (at least 6 characters)"] });
  if (!v) return;
  try { await api("password", "POST", { old: v[0], new: v[1] }); alert("Password changed"); } catch (x) { alert(x.message); }
}
function shell(title, html) {
  app.innerHTML = `<div class="top"><h1>${title}</h1><span>${esc(me.name)} (${me.role}) <button class="g" onclick="changePw()">Password</button> <button class="g" onclick="logout()">Log out</button></span></div>${html}`;
}
function home() { if (!me) return loginView(); ({ admin: adminView, teacher: teacherView, student: studentView })[me.role]().catch(x => alert(x.message)); }
function loginView() {
  app.innerHTML = `<div class="card"><h1 id="sn">Exam System</h1><label>Username<input id="u" name="username" autocomplete="username"></label><label>Password<input id="p" type="password" name="password" autocomplete="off" autocapitalize="off" spellcheck="false" data-pw></label>
  <p id="e" class="err"></p><button onclick="login()">Log in</button></div>`;
  $("p").onkeydown = e => e.key === "Enter" && login();
  fetch("/api/public").then(r => r.json()).then(d => { $("sn").textContent = d.siteName; document.title = d.siteName; }).catch(() => {});
}
async function login() {
  try { me = await api("login", "POST", { username: $("u").value, password: $("p").value }); localStorage.setItem("me", JSON.stringify(me)); home(); }
  catch (x) { $("e").textContent = x.message; }
}
function resTable(rs, showStudent = true) {
  lastRs = rs;
  return rs.length ? `<div style="overflow-x:auto"><table><tr>${showStudent ? "<th>Student</th>" : ""}<th>Exam</th><th>Score</th><th>Result</th><th>Warnings</th>${showStudent ? "<th>Photos</th>" : ""}${showStudent && me.role === "teacher" ? "<th>Retake</th>" : ""}${!showStudent ? "<th></th>" : ""}</tr>${rs.map(r =>
    `<tr>${showStudent ? `<td>${esc(r.student)}</td>` : ""}<td>${esc(r.exam)}${r.course ? ` <span class="muted">(${esc(r.course)})</span>` : ""}</td><td>${r.score}/${r.total} (${pc(r)}%)</td>
    <td class="${r.pending ? "muted" : (r.passed ?? pc(r) >= 50) ? "pass" : "fail"}">${r.pending ? "Pending" : (r.passed ?? pc(r) >= 50) ? "Pass" : "Fail"}</td><td>${r.violations || 0}</td>${showStudent ? `<td>${r.snaps ? `<button class="g" onclick="showSnaps(${r.examId},${r.studentId})">${r.snaps} photos</button>` : "–"}</td>` : ""}${showStudent && me.role === "teacher" ? `<td><button class="g" onclick="retake(${r.examId},${r.studentId})">Allow retake</button></td>` : ""}${!showStudent ? `<td><button class="g" onclick="reviewResult(${r.examId})">Review</button></td>` : ""}</tr>`).join("")}</table></div>` : `<p class="muted">No results yet.</p>`;
}
function exportCsv() {
  const rows = [["Student","Course","Exam","Score","Total","Percent","Result","Warnings","Date"], ...lastRs.map(r => [r.student, r.course || "", r.exam, r.score, r.total, pc(r), r.pending ? "Pending" : (r.passed ?? pc(r) >= 50) ? "Pass" : "Fail", r.violations || 0, r.at])];
  const b = new Blob([rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n")], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "results.csv"; a.click();
}

// ================= ADMIN =================
async function adminView() {
  const us = await api("users"), rs = await api("results"), st = await api("stats"), courses = await api("courses"), cfg = await api("settings"), notes = await api("notices");
  shell("Admin", `<div class="stats"><div><b>${st.students}</b>Students</div><div><b>${st.teachers}</b>Teachers</div><div><b>${st.courses}</b>Courses</div><div><b>${st.exams}</b>Exams</div><div><b>${st.taken}</b>Attempts</div><div><b>${st.avg}%</b>Average</div></div>
  ${noticeCard(courses, notes)}
  ${courseCard(courses, us.filter(u => u.role === "teacher"), true)}
  <div class="card"><h3>Settings</h3><label>School / site name<input id="sn2" value="${esc(cfg.siteName)}"></label>
  <div style="display:flex;gap:10px"><label style="flex:1">Default exam minutes<input id="sm" type="number" value="${cfg.minutes}"></label><label style="flex:1">Default pass mark (%)<input id="sp" type="number" value="${cfg.pass}"></label></div>
  <label class="chk"><input type="checkbox" id="ss" ${cfg.shuffle ? "checked" : ""}>Shuffle by default</label><label class="chk"><input type="checkbox" id="sa2" ${cfg.showAnswers ? "checked" : ""}>Show answers after submit by default</label>
  <p id="sm2" class="err"></p><button onclick="saveSettings()">Save settings</button></div>
  <div class="card"><h3>Add many students at once</h3><p class="muted">One student per line: Full name, username, password (you can paste from Excel)</p>
10;Chala Bekele, chala, pass5678"></textarea>
  <label>Enroll them in a course (optional)<select id="bc2"><option value="">- none -</option>${courses.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></label>
  <p id="bm2" class="err"></p><button onclick="bulkAdd()">Add students</button></div>
  <div class="card"><h3>Add user</h3>
   <input type="text" id="un" placeholder="Username">
<input type="password" id="pw" placeholder="Password">
  <select id="r"><option>student</option><option>teacher</option><option>admin</option></select><p id="m" class="err"></p><button onclick="addUser()">Add user</button></div>
  <div class="card"><h3>Users</h3>${us.map(x => `<div class="item"><span>${esc(x.name)} <span class="muted">· ${esc(x.username)} · ${x.role}</span></span>
  <span><button class="g" onclick="resetPw(${x.id})">Reset password</button> <button class="g" onclick="delUser(${x.id})">Delete</button></span></div>`).join("")}</div>
  <div class="card"><div class="top"><h3>All results</h3><button class="g" onclick="exportCsv()">Export CSV</button></div>${resTable(rs)}</div>`);
}
async function addUser() {
  try { await api("users", "POST", { name: $("n").value, username: $("un").value, password: $("pw").value, role: $("r").value }); adminView(); }
  catch (x) { $("m").textContent = x.message; }
}
async function resetPw(id) { const v = await dialog({ title: "Reset password", inputs: ["New password for this user"] }); if (v && v[0]) { await api(`users/${id}/password`, "PUT", { password: v[0] }); alert("Password reset"); } }
async function delUser(id) { if (await confirmBox("Delete this user?")) { await api("users/" + id, "DELETE"); adminView(); } }

// ================= TEACHER =================
function parseQs(t) {
  return parseLines(t).map(q => {
    const m = q.q.match(/^\[(img\d+|img:[^\]]+)\]\s*/);
    if (m) { q.q = q.q.slice(m[0].length); q.img = m[1].startsWith("img:") ? m[1].slice(4) : imgs[+m[1].slice(3) - 1]; if (!q.img) throw new Error("Unknown image in: " + q.q); }
    return q;
  });
}
function parseLines(t) {
  return t.split("\n").map(l => l.trim()).filter(Boolean).map(l => {
    let m;
    if ((m = l.match(/^essay:\s*(.*?)(?:\|\s*(\d+))?\s*$/i))) return { type: "essay", q: m[1].trim(), pts: +m[2] || 5 };
    if (/^multi:/i.test(l)) {
      const p = l.slice(6).split("|").map(s => s.trim()), a = p.pop().split(",").map(n => +n - 1);
      if (p.length < 3 || a.some(i => !(i >= 0 && i < p.length - 1))) throw new Error("Check this line: " + l);
      return { type: "multi", q: p[0], o: p.slice(1), a };
    }
    if (l.includes("=") && !l.includes("|")) { const [q, ...r] = l.split("="), a = r.join("=").trim(); if (!q.trim() || !a) throw new Error("Check this line: " + l); return { type: "text", q: q.trim(), a }; }
    const p = l.split("|").map(s => s.trim());
    if (p.length === 2 && /^(true|false)$/i.test(p[1])) return { type: "tf", q: p[0], o: ["True", "False"], a: /^true$/i.test(p[1]) ? 0 : 1 };
    const a = +p.pop() - 1;
    if (p.length < 3 || !(a >= 0 && a < p.length - 1)) throw new Error("Check this line: " + l);
    return { type: "mcq", q: p[0], o: p.slice(1), a };
  });
}
async function teacherView() {
  const ex = await api("exams"), rs = await api("results"), bank = await api("bank"), pend = await api("grading"), courses = await api("courses"), cfg = await api("settings"), notes = await api("notices");
  const subjects = [...new Set(bank.map(b => b.subject))]; extra = []; imgs = []; bankCache = bank; myExams = ex; editId = null; bEditIdx = null;
  const st = id => { const r = rs.filter(x => x.examId === id); return r.length ? `${r.length} taken · average ${Math.round(r.reduce((s, x) => s + pc(x), 0) / r.length)}% · ${Math.round(r.filter(x => x.passed === true || (x.passed === undefined && pc(x) >= 50)).length / r.length * 100)}% passed` : "No attempts yet"; };
  const gradeCard = pend.length ? pend.map(p => `<div class="rv"><b>${esc(p.student)}</b> · ${esc(p.exam)}<br><span class="muted">Q: ${esc(p.q)}</span>${p.guide ? `<br><span class="muted">Guide: ${esc(p.guide)}</span>` : ""}
    <p style="white-space:pre-wrap;border-left:3px solid var(--line);padding-left:10px">${esc(p.answer) || "(no answer)"}</p>
    <input id="g${p.examId}_${p.studentId}_${p.k}" type="number" min="0" max="${p.max}" placeholder="Mark 0-${p.max}" style="width:140px"> <input id="f${p.examId}_${p.studentId}_${p.k}" placeholder="Feedback for the student (optional)" style="width:55%"> <button onclick="gradeEssay(${p.examId},${p.studentId},${p.k},${p.max})">Save mark</button></div>`).join("") : '<p class="muted">Nothing is waiting to be graded.</p>';
  shell("Teacher", `<div class="card"><h3>Live exams</h3><div id="live" class="muted">Nobody is taking an exam right now.</div></div>
  ${noticeCard(courses, notes)}
  ${courseCard(courses, [], false)}
  <div class="card"><h3 id="title2">New exam</h3>
  <input id="t" placeholder="Exam title">
  <label>Course<select id="xc"><option value="">- no course (open to all students) -</option>${courses.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></label>
  <div style="display:flex;gap:10px"><label style="flex:1">Minutes<input id="mi" type="number" value="${cfg.minutes}" min="1"></label><label style="flex:1">Pass mark (%)<input id="ps" type="number" value="${cfg.pass}" min="0" max="100"></label></div>
  <div style="display:flex;gap:10px"><label style="flex:1">Access code (optional)<input id="ac" autocomplete="off"></label><label style="flex:1">Show only N random questions (optional)<input id="pk" type="number" min="0" placeholder="0 = all"></label></div>
  <label class="chk"><input type="checkbox" id="sh" ${cfg.shuffle ? "checked" : ""}>Shuffle questions and options</label><label class="chk"><input type="checkbox" id="sa" ${cfg.showAnswers ? "checked" : ""}>Show answers after submit</label><label class="chk"><input type="checkbox" id="pr">Require webcam</label>
  <div style="display:flex;gap:10px;margin-top:12px"><label style="flex:1">Opens (optional)<input id="op" type="datetime-local"></label><label style="flex:1">Closes (optional)<input id="cl" type="datetime-local"></label></div>
  <div class="card" style="background:var(--bg)"><h4 style="margin-top:0">Add a question</h4>
  <label>Question type<select id="bt" onchange="bType()"><option value="mcq">Multiple choice (one answer)</option><option value="multi">Multiple choice (several answers)</option><option value="tf">True / False</option><option value="text">Short answer (checked automatically)</option><option value="essay">Essay / writing (teacher marks it)</option></select></label>
  <label>Question<textarea id="bq" rows="2"></textarea></label>
  <div id="bf"></div>
  <label>Explanation shown to students in review (optional)<textarea id="bx" rows="2"></textarea></label>
  <div style="display:flex;gap:10px;align-items:end;margin-top:8px"><label style="width:110px">Points<input id="bp" type="number" min="1" value="1"></label>
  <button class="g" style="margin-bottom:12px" onclick="$('bimg').click()">Add image</button><input id="bimg" type="file" accept="image/*" hidden onchange="bImg(this)"><span id="bi" class="muted" style="margin-bottom:12px"></span></div>
  <p id="bm" class="err"></p><button id="badd" onclick="bAdd()">Add question to exam</button></div>
  <div id="draft"></div>
  <details id="qd" style="margin:12px 0"><summary>Quick add: paste many questions at once</summary>
  <textarea id="qs" rows="7" style="margin-top:8px" placeholder="One question per line:&#10;Multiple choice:  Question | A | B | C | D | correct number&#10;Several answers:  multi: Question | A | B | C | D | 1,3&#10;True/False:  Statement | true&#10;Short answer:  Question = answer&#10;Essay:  essay: Question | points"></textarea></details>
  <div style="margin:4px 0 12px"><button class="g" onclick="$('fq').click()">Import CSV / Excel</button> <button class="g" onclick="csvTemplate()">CSV template</button> <button class="g" onclick="$('fi').click()">Add image</button>
  <input id="fq" type="file" accept=".csv,.xlsx" hidden onchange="importQs(this)"><input id="fi" type="file" accept="image/*" hidden onchange="addImg(this)"></div>
  <div style="display:flex;gap:10px;align-items:end"><label style="flex:2">Add from question bank<select id="bs">${subjects.map(s => `<option>${esc(s)}</option>`).join("") || "<option value=''>(bank is empty)</option>"}</select></label>
  <label style="flex:1">How many<input id="bn" type="number" value="5" min="1"></label><button class="g" style="margin-bottom:12px" onclick="addFromBank()">Add</button></div>
  <label class="chk"><input type="checkbox" id="sb">Save typed questions to my bank as</label><input id="sj" placeholder="Subject, e.g. Biology">
  <p id="info" class="muted"></p><p id="m" class="err"></p><button id="cb" onclick="addExam()">Create exam</button> <button id="cx" class="g" hidden onclick="teacherView()">Cancel edit</button></div>
  <div class="card"><h3>My question bank</h3>${subjects.length ? subjects.map(s => `<div class="item"><span>${esc(s)} <span class="muted">· ${bank.filter(b => b.subject === s).length} questions</span></span><button class="g" onclick="delBank(${esc(JSON.stringify(s))})">Delete</button></div>`).join("") : '<p class="muted">Empty. Tick "Save typed questions to my bank" when creating an exam.</p>'}</div>
  ${myExamsCard(ex, courses, st)}
  <div class="card"><h3>Written answers to grade (${pend.length})</h3>${gradeCard}</div>
  <div class="card"><div class="top"><h3>Results</h3><button class="g" onclick="exportCsv()">Export CSV</button></div>${resTable(rs)}</div>`);
  bType(); renderDraft(); loadLive(); clearInterval(liveT); liveT = setInterval(loadLive, 10000);
}
async function addExam() {
  try {
    const typed = parseQs($("qs").value), questions = typed.concat(extra);
    if (!questions.length) throw new Error("Add at least one question");
    const ms = id => $(id).value ? new Date($(id).value).getTime() : null;
    await api(editId ? "exams/" + editId : "exams", editId ? "PUT" : "POST", { title: $("t").value, minutes: $("mi").value, pass: $("ps").value, shuffle: $("sh").checked, showAnswers: $("sa").checked,
      proctor: $("pr").checked, courseId: $("xc").value || null, code: $("ac").value, pick: $("pk").value, opensAt: ms("op"), closesAt: ms("cl"), questions });
    const fresh = questions.filter(q => !bankCache.some(b => b.q === q));
    if ($("sb").checked && fresh.length) await api("bank", "POST", { subject: $("sj").value.trim() || "General", questions: fresh });
    teacherView();
  } catch (x) { $("m").textContent = x.message; }
}
async function delExam(id) { if (await confirmBox("Delete this exam and all its results?")) { await api("exams/" + id, "DELETE"); teacherView(); } }

// ================= STUDENT =================
async function studentView() {
  const ex = await api("exams"), rs = await api("results"), cs = await api("courses"), nt = await api("notices");
  const item = x => `<div class="item"><span><b>${esc(x.title)}</b><br><span class="muted">${x.count} questions · ${x.minutes} min · pass mark ${x.pass}%${x.proctor ? " · webcam required" : ""}${x.needsCode ? " · access code" : ""}${x.closesAt ? " · closes " + new Date(x.closesAt).toLocaleString() : ""}</span></span>${examAction(x)}</div>`;
  const sect = (title, list) => `<div class="card"><h3>${title}</h3>${list.length ? list.map(item).join("") : '<p class="muted">No exams yet.</p>'}</div>`;
  const other = ex.filter(x => !cs.some(k => k.id === x.courseId));
  shell("Student", `${noticeList(nt)}${cs.map(k => sect(`${esc(k.name)} <span class="muted">${esc(k.code)} · ${esc(k.teacher)}</span>`, ex.filter(x => x.courseId === k.id))).join("")}${other.length || !cs.length ? sect("Other exams", other) : ""}
  <div class="card"><h3>My results</h3>${resTable(rs, false)}</div>`);
}
async function startExam(id, status, proctor, needsCode) {
  if (status === "new" && !(await confirmBox("Start now?\n\n• The timer cannot be paused.\n• Leaving this tab gives a warning. After 3 warnings the exam is submitted automatically."))) return;
  try {
    let code = ""; if (needsCode && status === "new") { const v = await dialog({ title: "Access code", inputs: ["Enter the code given by your teacher"] }); if (!v) return; code = v[0]; }

function addImg(inp) {
  const f = inp.files[0]; if (!f) return;
  const im = new Image();
  im.onload = () => {
    const k = Math.min(1, 700 / im.width), c = document.createElement("canvas"); c.width = im.width * k; c.height = im.height * k;
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); imgs.push(c.toDataURL("image/jpeg", 0.7));
    const t = $("qs"); t.value += (t.value && !t.value.endsWith("\n") ? "\n" : "") + `[img${imgs.length}] `; $("qd").open = true; t.focus();
    $("info").textContent = `Image saved as [img${imgs.length}]. Finish that line with your question.`;
  };
  im.src = URL.createObjectURL(f); inp.value = "";
}
function csvRows(t) {
  const rows = []; let r = [], c = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"' && t[i + 1] === '"') { c += '"'; i++; } else if (ch === '"') q = false; else c += ch; }
    else if (ch === '"') q = true; else if (ch === ",") { r.push(c); c = ""; }
    else if (ch === "\n") { r.push(c); rows.push(r); r = []; c = ""; } else if (ch !== "\r") c += ch;
  }
  r.push(c); rows.push(r); return rows;
}
async function importQs(inp) {
  const f = inp.files[0]; if (!f) return; let rows;
  try {
    if (/\.xlsx$/i.test(f.name)) {
      if (!window.XLSX) await new Promise((ok, no) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = ok; s.onerror = () => no(new Error("Excel reader needs internet. Save the file as CSV and import that instead.")); document.head.append(s); });
      const wb = XLSX.read(await f.arrayBuffer()); rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
    } else rows = csvRows(await f.text());
    const lines = rows.slice(1).map(r => Array.from({ length: 7 }, (_, i) => String(r[i] ?? "").trim())).filter(r => r[1]).map(([t, q, a, b, c, d, ans]) => {
      q = q.replace(/\|/g, "/"); t = t.toLowerCase();
      return t === "text" ? `${q} = ${ans}` : t === "tf" ? `${q} | ${ans}` : `${q} | ${[a, b, c, d].filter(Boolean).join(" | ")} | ${ans}`;
    });
    const ta = $("qs"); ta.value += (ta.value && !ta.value.endsWith("\n") ? "\n" : "") + lines.join("\n");
    $("info").textContent = `${lines.length} question(s) imported. Check them below, then create the exam.`; $("m").textContent = "";
  } catch (x) { $("m").textContent = x.message; }
  inp.value = "";
}
function csvTemplate() {
  const t = 'Type,Question,Option1,Option2,Option3,Option4,Answer\nmcq,What is 12 x 8?,96,88,108,86,1\ntf,The Earth is flat,,,,,false\ntext,Capital of Ethiopia,,,,,Addis Ababa\n';
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([t], { type: "text/csv" })); a.download = "questions-template.csv"; a.click();

function bImg(inp) {
  const f = inp.files[0]; if (!f) return; const im = new Image();
  im.onload = () => { const k = Math.min(1, 700 / im.width), c = document.createElement("canvas"); c.width = im.width * k; c.height = im.height * k;
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); bImgData = c.toDataURL("image/jpeg", 0.7); $("bi").textContent = "Image attached"; };

function bAdd() {
  try {
    const type = $("bt").value, q = $("bq").value.trim(), item = { type, q, pts: Math.max(1, +$("bp").value || 1) };
    if (!q) throw new Error("Write the question first");
    if (type === "mcq" || type === "multi") {
      const txt = [...document.querySelectorAll(".bo")].map(i => i.value.trim()), on = [...document.querySelectorAll(".bk")].map(i => i.checked);
      const keep = txt.map((t, i) => t ? i : -1).filter(i => i >= 0);
      if (keep.length < 2) throw new Error("Give at least two options");
      const right = keep.map((i, k) => on[i] ? k : -1).filter(k => k >= 0);
      if (!right.length) throw new Error("Tick the correct answer");
      item.o = keep.map(i => txt[i]); item.a = type === "mcq" ? right[0] : right;

function editExam(id) {
  const x = myExams.find(e => e.id === id); if (!x) return;
  const ts = v => v ? new Date(v - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16) : "";
  editId = id; extra = JSON.parse(JSON.stringify(x.questions)); bEditIdx = null;
  $("t").value = x.title; $("xc").value = x.courseId || ""; $("mi").value = x.minutes; $("ps").value = x.pass ?? 50;
  $("sh").checked = !!x.shuffle; $("sa").checked = !!x.showAnswers; $("pr").checked = !!x.proctor; $("op").value = ts(x.opensAt); $("cl").value = ts(x.closesAt);
  $("ac").value = x.code || ""; $("pk").value = x.pick || ""; $("qs").value = ""; $("sb").checked = false; $("info").textContent = "Editing - change anything, then press Save changes.";
  $("title2").textContent = "Edit exam: " + x.title; $("cb").textContent = "Save changes"; $("cx").hidden = false;
  renderDraft(); $("title2").scrollIntoView({ behavior: "smooth" });
}
function bMove(i, d) { const j = i + d; if (j < 0 || j >= extra.length) return; [extra[i], extra[j]] = [extra[j], extra[i]]; bEditIdx = null; renderDraft(); }
function bRemove(i) { extra.splice(i, 1); bEditIdx = null; renderDraft(); }
function bEdit(i) {
  const q = extra[i]; bEditIdx = i; $("bt").value = q.type || "mcq"; bType();
  $("bq").value = q.q; $("bx").value = q.explain || ""; $("bp").value = q.pts || 1; bImgData = q.img || null; $("bi").textContent = q.img ? "Image attached" : "";
  if (!q.type || q.type === "mcq" || q.type === "multi") {
    document.querySelectorAll(".bo").forEach((inp, k) => { inp.value = q.o[k] || ""; });
    document.querySelectorAll(".bk").forEach((inp, k) => { inp.checked = [].concat(q.a).includes(k); });
  } else if (q.type === "tf") document.querySelector(`input[name=tf][value=${q.a === 0 ? "true" : "false"}]`).checked = true;
  else if (q.type === "text") $("ba").value = [].concat(q.a).join(" | ");
  else $("bg").value = q.guide || "";
  $("badd").textContent = "Update question"; $("bq").scrollIntoView({ behavior: "smooth" });
}
async function retake(e, s) {
  if (!(await confirmBox("Delete this student's result so they can take the exam again? The old result will be lost."))) return;
  try { await api(`exams/${e}/reset`, "POST", { studentId: s }); teacherView(); } catch (x) { alert(x.message); }
}

// ---- Exams grouped by course, review, analysis, copy ----
function myExamsCard(ex, courses, st) {
  const item = x => `<div class="item"><span><b>${esc(x.title)}</b><br><span class="muted">${x.questions.length} questions · ${x.minutes} min · pass ${x.pass ?? 50}%${x.code ? " · code: " + esc(x.code) : ""}${x.pick ? " · random " + x.pick : ""}<br>${st(x.id)}</span></span>
    <span><button class="g" onclick="showAnalysis(${x.id})">Analysis</button> <button class="g" onclick="editExam(${x.id})">Edit</button> <button class="g" onclick="dupExam(${x.id})">Copy</button> <button class="g" onclick="delExam(${x.id})">Delete</button></span></div>`;
  const grp = (title, list, cid) => `<div class="card"><div class="top"><h3>${title}</h3><button class="g" onclick="newExamIn(${cid})">+ New exam</button></div>${list.length ? list.map(item).join("") : '<p class="muted">No exams yet.</p>'}</div>`;
  const loose = ex.filter(x => !courses.some(k => k.id === x.courseId));
  return courses.map(k => grp(`${esc(k.name)} <span class="muted">${esc(k.code)}</span>`, ex.filter(x => x.courseId === k.id), k.id)).join("") + (loose.length || !courses.length ? grp("Exams without a course", loose, 0) : "");
}
function newExamIn(cid) { $("xc").value = cid || ""; $("title2").scrollIntoView({ behavior: "smooth" }); $("t").focus(); }
function dupExam(id) {
  editExam(id); editId = null; $("t").value += " (copy)"; $("title2").textContent = "New exam (copy)"; $("cb").textContent = "Create exam";
  $("info").textContent = "Copy loaded - change what you need, then press Create exam.";
}
async function showAnalysis(id) {
  try {
    const rows = await api("analysis/" + id), d = document.createElement("div");
    d.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.75);overflow:auto;padding:20px;z-index:9";
    d.innerHTML = `<div class="card" style="max-width:720px;margin:0 auto"><div class="top"><h3>Question analysis</h3><button onclick="this.parentNode.parentNode.parentNode.remove()">Close</button></div>
    <p class="muted">Share of students who got each question right. Very low = too hard or unclear; very high = too easy.</p>
    ${rows.map(r => `<div class="rv"><b>${r.qi + 1}. ${esc(r.q)}</b><br><span class="muted">${r.n} answered</span> · <b class="${r.pct === null ? "muted" : r.pct >= 60 ? "pass" : "fail"}">${r.pct === null ? "no data" : r.pct + "%"}</b></div>`).join("")}</div>`;
    document.body.append(d);
  } catch (x) { alert(x.message); }
}
async function reviewResult(id) {
  try {
    const r = await api("review/" + id);
    shell("Review: " + esc(r.exam), `<div class="card"><p class="big ${r.passed ? "pass" : "fail"}">${r.percent}%</p><p>${r.pending ? "<b>Awaiting grading</b> · " : ""}${r.score} of ${r.total} points</p>
    ${r.review ? r.review.map((x, i) => `<div class="rv"><b>${i + 1}. ${esc(x.q)}</b> <span class="muted">(${x.pts} pt)</span><br>
      <span class="${x.ok === null ? "muted" : x.ok ? "pass" : "fail"}">Your answer: ${esc(x.yours)}</span>${x.ok === false ? `<br>Correct answer: ${esc(x.right)}` : ""}
      ${x.mark !== undefined ? `<br>Mark: <b>${x.mark === null ? "not graded yet" : x.mark + " / " + x.max}</b>${x.feedback ? `<br>Teacher feedback: ${esc(x.feedback)}` : ""}` : ""}
      ${x.explain ? `<br><span class="muted">Explanation: ${esc(x.explain)}</span>` : ""}</div>`).join("") : '<p class="muted">The question review is not available for this exam.</p>'}
    <p><button onclick="studentView()">Back</button></p></div>`);
  } catch (x) { alert(x.message); }
}

// ---- Anti-cheat: tab switching and copy/paste ----
document.addEventListener("visibilitychange", () => {
  if (!cur || cur.done || !document.hidden) return;
  cur.viol++; persist();
  $("warn").textContent = `Warning ${cur.viol}/3: you left the exam tab. At 3 warnings the exam is submitted automatically.`;
  if (cur.viol >= 3) submitExam(false);
});
["copy", "cut", "paste", "contextmenu"].forEach(t => document.addEventListener(t, e => { if (cur && !cur.done) e.preventDefault(); }));

home();
</script>
